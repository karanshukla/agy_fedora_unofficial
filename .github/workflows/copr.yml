name: COPR

# Every 6 hours: if upstream Antigravity has no build in COPR for VERSION-RELEASE yet, build one
# and publish the COPR-signed RPMs (plus SHA256SUMS) to a GitHub Release.
# A run fails, and GitHub emails, if the manifest/download fails, the version inside app.asar does
# not match the manifest, or the COPR build fails.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      retry:
        description: "Build again even if the last COPR build of this version failed"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "antigravity.spec"
      - "antigravity.desktop"
      - "antigravity.sh"
      - "RELEASE"
      - "latest-version.sh"
      - "make-srpm.sh"
      - ".github/workflows/copr.yml"

permissions:
  contents: read

concurrency:
  group: copr
  cancel-in-progress: false

env:
  PROJECT: agy_fedora_unofficial
  OWNER: karanshukla

jobs:
  build:
    runs-on: ubuntu-latest
    # COPR_CONFIG lives in this environment, which only main can deploy to.
    environment: copr
    permissions:
      contents: write
    timeout-minutes: 120
    container: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tools
        run: dnf -y -q install --setopt=install_weak_deps=False copr-cli gh rpm-build curl jq python3 tar gzip

      - name: What needs building
        id: want
        env:
          RETRY: ${{ inputs.retry }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IFS=$'\t' read -r VER URL < <(./latest-version.sh --url)
          REL=$(tr -d '[:space:]' < RELEASE)
          WANT="$VER-$REL"
          TAG="v$WANT"
          echo "Upstream Antigravity: $VER, want antigravity-$WANT in $OWNER/$PROJECT"
          {
            echo "ver=$VER"
            echo "want=$WANT"
            echo "tag=$TAG"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"
          builds=$(curl -fsS "https://copr.fedorainfracloud.org/api_3/build/list?ownername=$OWNER&projectname=$PROJECT&packagename=antigravity&limit=50" \
            || echo '{"items":[]}')
          match=$(jq -c --arg v "$WANT" '
            def norm: sub("^[0-9]+:"; "") | gsub("\\.fc[0-9]+"; "");
            [.items[] | select((.source_package.version // "" | norm) == ($v | norm))] | first // {}' <<<"$builds")
          STATE=$(jq -r '.state // "none"' <<<"$match")
          BUILD_ID=$(jq -r '.id // ""' <<<"$match")
          echo "newest COPR build of antigravity-$WANT: $STATE (id=${BUILD_ID:-none})"
          release=no
          case "$STATE" in
            succeeded)
              build=no
              if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
                release=yes
              fi ;;
            running|pending|starting|importing|waiting|forked) build=no ;;
            failed|canceled)
              if [ "$RETRY" = true ]; then
                build=yes
                release=yes
              else
                echo "::error::the last COPR build of antigravity-$WANT $STATE; fix it and bump RELEASE, or run this workflow with retry"
                exit 1
              fi ;;
            *)
              build=yes
              release=yes ;;
          esac
          {
            echo "build=$build"
            echo "release=$release"
            echo "build_id=$BUILD_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Source RPM
        if: steps.want.outputs.build == 'yes'
        env:
          TAR_URL: ${{ steps.want.outputs.url }}
        run: ./make-srpm.sh out "$TAR_URL"

      - name: COPR build
        id: copr
        if: steps.want.outputs.build == 'yes'
        env:
          COPR_CONFIG: ${{ secrets.COPR_CONFIG }}
        run: |
          set -euo pipefail
          test -n "$COPR_CONFIG" || { echo "::error::COPR_CONFIG is not set in the copr environment"; exit 1; }
          umask 077
          mkdir -p ~/.config
          printf '%s\n' "$COPR_CONFIG" > ~/.config/copr
          out_log=$(mktemp)
          copr-cli build "$OWNER/$PROJECT" out/*.src.rpm | tee "$out_log"
          build_id=$(awk '/^Created builds:/ {print $3; exit}' "$out_log")
          test -n "$build_id" || { echo "::error::could not parse COPR build id"; exit 1; }
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"

      - name: GitHub Release
        if: steps.want.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VER: ${{ steps.want.outputs.ver }}
          WANT: ${{ steps.want.outputs.want }}
          TAG: ${{ steps.want.outputs.tag }}
          BUILD_ID: ${{ steps.copr.outputs.build_id || steps.want.outputs.build_id }}
        run: |
          set -euo pipefail
          test -n "$BUILD_ID" || { echo "::error::missing COPR build id for release"; exit 1; }
          mkdir -p release-rpms release-assets
          copr-cli download-build "$BUILD_ID" --dest release-rpms
          find release-rpms -type f -name 'antigravity-*.x86_64.rpm' -exec cp -t release-assets {} +
          shopt -s nullglob
          rpms=(release-assets/antigravity-*.x86_64.rpm)
          test "${#rpms[@]}" -gt 0 || { echo "::error::no x86_64 RPMs downloaded from COPR build $BUILD_ID"; exit 1; }
          (cd release-assets && sha256sum antigravity-*.x86_64.rpm > SHA256SUMS)
          notes=$(cat <<EOF
          Unofficial Fedora RPMs for Antigravity \`$VER\` (package release \`$WANT\`).

          Built and signed by [Fedora COPR build #$BUILD_ID](https://copr.fedorainfracloud.org/coprs/$OWNER/$PROJECT/build/$BUILD_ID/).

          ### Install via COPR (recommended)
          \`\`\`bash
          sudo dnf copr enable $OWNER/$PROJECT
          sudo dnf install antigravity
          \`\`\`

          ### Or install a downloaded RPM directly
          \`\`\`bash
          sudo dnf install ./antigravity-$WANT.fc45.x86_64.rpm
          \`\`\`
          EOF
          )
          gh release create "$TAG" "${rpms[@]}" release-assets/SHA256SUMS \
            -R "$REPO" \
            --title "Antigravity $VER ($WANT)" \
            --notes "$notes"
